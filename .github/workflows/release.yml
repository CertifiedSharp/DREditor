name: Normalize release (rename Samples -> Samples~, remove samples.meta)

on:
  push:
    branches:
      - release
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'release-bot'
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release

      - name: Configure git identity
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"

      - name: Rename Samples and remove samples.meta
        run: |
          set -e
          git fetch origin release
          RELEASE_SHA=$(git rev-parse origin/release)

          ls -la

          CHANGED=0

          echo "Searching for any Samples folder (case-insensitive, repo-wide):"
          FOUND_DIRS=$(find . -path ./.git -prune -o -type d -iname "Samples" -print)

          if [ -z "$FOUND_DIRS" ]; then
            echo "No Samples folders found."
          else
            echo "$FOUND_DIRS"
            while IFS= read -r dir; do
              parent=$(dirname "$dir")
              target="$parent/Samples~"
              echo "Renaming $dir -> $target"
              git mv "$dir" "$target"
              CHANGED=1
            done <<< "$FOUND_DIRS"
          fi

          echo "Searching for any samples.meta files (case-insensitive, repo-wide):"
          FOUND_META=$(find . -path ./.git -prune -o -type f -iname "samples.meta" -print)

          if [ -z "$FOUND_META" ]; then
            echo "No samples.meta files found."
          else
            echo "$FOUND_META"
            while IFS= read -r file; do
              echo "Removing $file"
              git rm -f "$file"
              CHANGED=1
            done <<< "$FOUND_META"
          fi

          if [ "$CHANGED" -eq 1 ]; then
            git commit -m "Renaming Samples -> Samples~ and remove samples.meta from ${RELEASE_SHA:0:7}"
            git push origin HEAD:refs/heads/release
          else
            echo "No changes to commit — nothing to push."
          fi

  fullName: DG.Tweening.DOTweenModuleUI.DOPunchAnchorPos(UnityEngine.RectTransform, UnityEngine.Vector2, float, int, float, bool)
  type: Method
  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModuleUI.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Punches a RectTransform's anchoredPosition towards the given direction and then back to the starting one
                as if it was connected to the starting position via an elastic.
                Also stores the RectTransform as the tween's target so it can be used for filtered operations
  example: []
  syntax:
    content: public static Tweener DOPunchAnchorPos(this RectTransform target, Vector2 punch, float duration, int vibrato = 10, float elasticity = 1, bool snapping = false)
    parameters:
    - id: target
      type: UnityEngine.RectTransform
    - id: punch
      type: UnityEngine.Vector2
      description: The direction and strength of the punch (added to the RectTransform's current position)
    - id: duration
      type: System.Single
      description: The duration of the tween
    - id: vibrato
      type: System.Int32
      description: Indicates how much will the punch vibrate
    - id: elasticity
      type: System.Single
      description: >-
        Represents how much (0 to 1) the vector will go beyond the starting position when bouncing backwards.
                    1 creates a full oscillation between the punch direction and the opposite direction,
                    while 0 oscillates only between the punch and the start position
    - id: snapping
      type: System.Boolean
      description: If TRUE the tween will smoothly snap all values to integers
    return:
      type: DG.Tweening.Tweener
    content.vb: Public Shared Function DOPunchAnchorPos(target As RectTransform, punch As Vector2, duration As Single, vibrato As Integer = 10, elasticity As Single = 1, snapping As Boolean = False) As Tweener

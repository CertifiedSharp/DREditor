  type: Method
  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModuleUI.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Tweens a RectTransform's anchoredPosition so that it draws a circle around the given center.
                Also stores the RectTransform as the tween's target so it can be used for filtered operations.
    <p></p>

                IMPORTANT: SetFrom(value) requires a <xref href="UnityEngine.Vector2" data-throw-if-not-resolved="false"></xref> instead of a float, where the X property represents the "from degrees value"
  example: []
  syntax:
    content: public static TweenerCore<Vector2, Vector2, CircleOptions> DOShapeCircle(this RectTransform target, Vector2 center, float endValueDegrees, float duration, bool relativeCenter = false, bool snapping = false)
    parameters:
    - id: target
      type: UnityEngine.RectTransform
    - id: center
      type: UnityEngine.Vector2
      description: Circle-center/pivot around which to rotate (in UI anchoredPosition coordinates)
    - id: endValueDegrees
      type: System.Single
      description: The end value degrees to reach (to rotate counter-clockwise pass a negative value)
    - id: duration
      type: System.Single
      description: The duration of the tween
    - id: relativeCenter
      type: System.Boolean
      description: If TRUE the center coordinates will be considered as relative to the target's current anchoredPosition
    - id: snapping
      type: System.Boolean
      description: If TRUE the tween will smoothly snap all values to integers
    return:
      type: DG.Tweening.Core.TweenerCore{UnityEngine.Vector2,UnityEngine.Vector2,DG.Tweening.Plugins.CircleOptions}
    content.vb: Public Shared Function DOShapeCircle(target As RectTransform, center As Vector2, endValueDegrees As Single, duration As Single, relativeCenter As Boolean = False, snapping As Boolean = False) As TweenerCore(Of Vector2, Vector2, CircleOptions)

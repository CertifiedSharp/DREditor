  - csharp
  - vb
  name: DOPath(Rigidbody2D, Vector2[], float, PathType, PathMode, int, Color?)
  nameWithType: DOTweenModulePhysics2D.DOPath(Rigidbody2D, Vector2[], float, PathType, PathMode, int, Color?)
  fullName: DG.Tweening.DOTweenModulePhysics2D.DOPath(UnityEngine.Rigidbody2D, UnityEngine.Vector2[], float, DG.Tweening.PathType, DG.Tweening.PathMode, int, UnityEngine.Color?)
  type: Method
  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModulePhysics2D.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Tweens a Rigidbody2D's position through the given path waypoints, using the chosen path algorithm.
                Also stores the Rigidbody2D as the tween's target so it can be used for filtered operations.

                <p>NOTE: to tween a Rigidbody2D correctly it should be set to kinematic at least while being tweened.</p>
                <p>BEWARE: doesn't work on Windows Phone store (waiting for Unity to fix their own bug).
                If you plan to publish there you should use a regular transform.DOPath.</p>
  example: []
  syntax:
    content: public static TweenerCore<Vector3, Path, PathOptions> DOPath(this Rigidbody2D target, Vector2[] path, float duration, PathType pathType = 0, PathMode pathMode = 1, int resolution = 10, Color? gizmoColor = null)
    parameters:
    - id: target
      type: UnityEngine.Rigidbody2D
    - id: path
      type: UnityEngine.Vector2[]
      description: The waypoints to go through
    - id: duration
      type: System.Single
      description: The duration of the tween
    - id: pathType
      type: DG.Tweening.PathType
      description: 'The type of path: Linear (straight path), CatmullRom (curved CatmullRom path) or CubicBezier (curved with control points)'
    - id: pathMode
      type: DG.Tweening.PathMode
      description: 'The path mode: 3D, side-scroller 2D, top-down 2D'
    - id: resolution
      type: System.Int32
      description: >-
        The resolution of the path (useless in case of Linear paths): higher resolutions make for more detailed curved paths but are more expensive.
                    Defaults to 10, but a value of 5 is usually enough if you don't have dramatic long curves between waypoints
    - id: gizmoColor
      type: System.Nullable{UnityEngine.Color}
      description: The color of the path (shown when gizmos are active in the Play panel and the tween is running)
    return:
      type: DG.Tweening.Core.TweenerCore{UnityEngine.Vector3,DG.Tweening.Plugins.Core.PathCore.Path,DG.Tweening.Plugins.Options.PathOptions}
    content.vb: Public Shared Function DOPath(target As Rigidbody2D, path As Vector2(), duration As Single, pathType As PathType = 0, pathMode As PathMode = 1, resolution As Integer = 10, gizmoColor As Color? = Nothing) As TweenerCore(Of Vector3, Path, PathOptions)
  overload: DG.Tweening.DOTweenModulePhysics2D.DOPath*
  nameWithType.vb: DOTweenModulePhysics2D.DOPath(Rigidbody2D, Vector2(), Single, PathType, PathMode, Integer, Color?)
  fullName.vb: DG.Tweening.DOTweenModulePhysics2D.DOPath(UnityEngine.Rigidbody2D, UnityEngine.Vector2(), Single, DG.Tweening.PathType, DG.Tweening.PathMode, Integer, UnityEngine.Color?)
  name.vb: DOPath(Rigidbody2D, Vector2(), Single, PathType, PathMode, Integer, Color?)

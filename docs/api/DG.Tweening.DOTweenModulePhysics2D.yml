- uid: DG.Tweening.DOTweenModulePhysics2D.DOJump(UnityEngine.Rigidbody2D,UnityEngine.Vector2,System.Single,System.Int32,System.Single,System.Boolean)
  commentId: M:DG.Tweening.DOTweenModulePhysics2D.DOJump(UnityEngine.Rigidbody2D,UnityEngine.Vector2,System.Single,System.Int32,System.Single,System.Boolean)
  id: DOJump(UnityEngine.Rigidbody2D,UnityEngine.Vector2,System.Single,System.Int32,System.Single,System.Boolean)
  isExtensionMethod: true
  parent: DG.Tweening.DOTweenModulePhysics2D
  langs:
  - csharp
  - vb
  name: DOJump(Rigidbody2D, Vector2, float, int, float, bool)
  nameWithType: DOTweenModulePhysics2D.DOJump(Rigidbody2D, Vector2, float, int, float, bool)
  fullName: DG.Tweening.DOTweenModulePhysics2D.DOJump(UnityEngine.Rigidbody2D, UnityEngine.Vector2, float, int, float, bool)
  type: Method
  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModulePhysics2D.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Tweens a Rigidbody2D's position to the given value, while also applying a jump effect along the Y axis.
                Returns a Sequence instead of a Tweener.
                Also stores the Rigidbody2D as the tween's target so it can be used for filtered operations.

                <p>IMPORTANT: a rigidbody2D can't be animated in a jump arc using MovePosition, so the tween will directly set the position</p>
  example: []
  syntax:
    content: public static Sequence DOJump(this Rigidbody2D target, Vector2 endValue, float jumpPower, int numJumps, float duration, bool snapping = false)
    parameters:
    - id: target
      type: UnityEngine.Rigidbody2D
    - id: endValue
      type: UnityEngine.Vector2
      description: The end value to reach
    - id: jumpPower
      type: System.Single
      description: Power of the jump (the max height of the jump is represented by this plus the final Y offset)
    - id: numJumps
      type: System.Int32
      description: Total number of jumps
    - id: duration
      type: System.Single
      description: The duration of the tween
    - id: snapping
      type: System.Boolean
      description: If TRUE the tween will smoothly snap all values to integers
    return:
      type: DG.Tweening.Sequence
    content.vb: Public Shared Function DOJump(target As Rigidbody2D, endValue As Vector2, jumpPower As Single, numJumps As Integer, duration As Single, snapping As Boolean = False) As Sequence
  overload: DG.Tweening.DOTweenModulePhysics2D.DOJump*
  nameWithType.vb: DOTweenModulePhysics2D.DOJump(Rigidbody2D, Vector2, Single, Integer, Single, Boolean)
  fullName.vb: DG.Tweening.DOTweenModulePhysics2D.DOJump(UnityEngine.Rigidbody2D, UnityEngine.Vector2, Single, Integer, Single, Boolean)
  name.vb: DOJump(Rigidbody2D, Vector2, Single, Integer, Single, Boolean)

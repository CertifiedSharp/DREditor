  namespace: DG.Tweening
  summary: >-
    Tweens a Material's color using the given gradient
                (NOTE 1: only uses the colors of the gradient, not the alphas - NOTE 2: creates a Sequence, not a Tweener).
                Also stores the image as the tween's target so it can be used for filtered operations
  example: []
  syntax:
    content: public static Sequence DOGradientColor(this Material target, Gradient gradient, float duration)
    parameters:
    - id: target
      type: UnityEngine.Material
    - id: gradient
      type: UnityEngine.Gradient
      description: The gradient to use
    - id: duration
      type: System.Single
      description: The duration of the tween
    return:
      type: DG.Tweening.Sequence

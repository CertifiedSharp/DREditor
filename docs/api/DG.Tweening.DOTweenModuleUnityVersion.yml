  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Returns a <xref href="UnityEngine.CustomYieldInstruction" data-throw-if-not-resolved="false"></xref> that waits until the tween is killed or complete.

    It can be used inside a coroutine as a yield.


    <p>Example usage:</p><pre><code class="lang-csharp">yield return myTween.WaitForCompletion(true);</code></pre>
  example: []
  syntax:
    content: public static CustomYieldInstruction WaitForCompletion(this Tween t, bool returnCustomYieldInstruction)

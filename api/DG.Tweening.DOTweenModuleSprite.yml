- uid: DG.Tweening.DOTweenModuleSprite.DOBlendableColor(UnityEngine.SpriteRenderer,UnityEngine.Color,System.Single)
  commentId: M:DG.Tweening.DOTweenModuleSprite.DOBlendableColor(UnityEngine.SpriteRenderer,UnityEngine.Color,System.Single)
  id: DOBlendableColor(UnityEngine.SpriteRenderer,UnityEngine.Color,System.Single)
  isExtensionMethod: true
  parent: DG.Tweening.DOTweenModuleSprite
  langs:
  - csharp
  - vb
  name: DOBlendableColor(SpriteRenderer, Color, float)
  nameWithType: DOTweenModuleSprite.DOBlendableColor(SpriteRenderer, Color, float)
  fullName: DG.Tweening.DOTweenModuleSprite.DOBlendableColor(UnityEngine.SpriteRenderer, UnityEngine.Color, float)
  type: Method
  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModuleSprite.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Tweens a SpriteRenderer's color to the given value,
                in a way that allows other DOBlendableColor tweens to work together on the same target,
                instead than fight each other as multiple DOColor would do.
                Also stores the SpriteRenderer as the tween's target so it can be used for filtered operations
  example: []
  syntax:
    content: public static Tweener DOBlendableColor(this SpriteRenderer target, Color endValue, float duration)
    parameters:
    - id: target
      type: UnityEngine.SpriteRenderer
    - id: endValue
      type: UnityEngine.Color
      description: The value to tween to
    - id: duration
      type: System.Single
      description: The duration of the tween
    return:
      type: DG.Tweening.Tweener
    content.vb: Public Shared Function DOBlendableColor(target As SpriteRenderer, endValue As Color, duration As Single) As Tweener
  overload: DG.Tweening.DOTweenModuleSprite.DOBlendableColor*
  nameWithType.vb: DOTweenModuleSprite.DOBlendableColor(SpriteRenderer, Color, Single)
  fullName.vb: DG.Tweening.DOTweenModuleSprite.DOBlendableColor(UnityEngine.SpriteRenderer, UnityEngine.Color, Single)
  name.vb: DOBlendableColor(SpriteRenderer, Color, Single)

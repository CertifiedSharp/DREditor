  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Tweens a SpriteRenderer's color to the given value.
                Also stores the spriteRenderer as the tween's target so it can be used for filtered operations
  example: []
  syntax:
    content: public static TweenerCore<Color, Color, ColorOptions> DOColor(this SpriteRenderer target, Color endValue, float duration)
    parameters:
    - id: target
      type: UnityEngine.SpriteRenderer
    - id: endValue
      type: UnityEngine.Color
      description: The end value to reach
    - id: duration
      type: System.Single
      description: The duration of the tween
    return:
      type: DG.Tweening.Core.TweenerCore{UnityEngine.Color,UnityEngine.Color,DG.Tweening.Plugins.Options.ColorOptions}

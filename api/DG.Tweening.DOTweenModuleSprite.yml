  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModuleSprite.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Tweens a SpriteRenderer's color using the given gradient
                (NOTE 1: only uses the colors of the gradient, not the alphas - NOTE 2: creates a Sequence, not a Tweener).
                Also stores the image as the tween's target so it can be used for filtered operations
  example: []
  syntax:
    content: public static Sequence DOGradientColor(this SpriteRenderer target, Gradient gradient, float duration)
    parameters:
    - id: target
      type: UnityEngine.SpriteRenderer
    - id: gradient
      type: UnityEngine.Gradient
      description: The gradient to use
    - id: duration
      type: System.Single
      description: The duration of the tween
    return:
      type: DG.Tweening.Sequence
    content.vb: Public Shared Function DOGradientColor(target As SpriteRenderer, gradient As Gradient, duration As Single) As Sequence
  overload: DG.Tweening.DOTweenModuleSprite.DOGradientColor*
  nameWithType.vb: DOTweenModuleSprite.DOGradientColor(SpriteRenderer, Gradient, Single)

  langs:
  - csharp
  - vb
  name: DOSetFloat(AudioMixer, string, float, float)
  nameWithType: DOTweenModuleAudio.DOSetFloat(AudioMixer, string, float, float)
  fullName: DG.Tweening.DOTweenModuleAudio.DOSetFloat(UnityEngine.Audio.AudioMixer, string, float, float)
  type: Method
  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModuleAudio.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Tweens an AudioMixer's exposed float to the given value.
                Also stores the AudioMixer as the tween's target so it can be used for filtered operations.
                Note that you need to manually expose a float in an AudioMixerGroup in order to be able to tween it from an AudioMixer.
  example: []
  syntax:
    content: public static TweenerCore<float, float, FloatOptions> DOSetFloat(this AudioMixer target, string floatName, float endValue, float duration)
    parameters:
    - id: target
      type: UnityEngine.Audio.AudioMixer
    - id: floatName
      type: System.String
      description: Name given to the exposed float to set
    - id: endValue
      type: System.Single
      description: The end value to reach
    - id: duration
      type: System.Single
      description: The duration of the tween
    return:
      type: DG.Tweening.Core.TweenerCore{System.Single,System.Single,DG.Tweening.Plugins.Options.FloatOptions}
    content.vb: Public Shared Function DOSetFloat(target As AudioMixer, floatName As String, endValue As Single, duration As Single) As TweenerCore(Of Single, Single, FloatOptions)
  overload: DG.Tweening.DOTweenModuleAudio.DOSetFloat*

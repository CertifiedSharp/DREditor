  name.vb: DOSetFloat(AudioMixer, String, Single, Single)
- uid: DG.Tweening.DOTweenModuleAudio.DOComplete(UnityEngine.Audio.AudioMixer,System.Boolean)
  commentId: M:DG.Tweening.DOTweenModuleAudio.DOComplete(UnityEngine.Audio.AudioMixer,System.Boolean)
  id: DOComplete(UnityEngine.Audio.AudioMixer,System.Boolean)
  isExtensionMethod: true
  parent: DG.Tweening.DOTweenModuleAudio
  langs:
  - csharp
  - vb
  name: DOComplete(AudioMixer, bool)
  nameWithType: DOTweenModuleAudio.DOComplete(AudioMixer, bool)
  fullName: DG.Tweening.DOTweenModuleAudio.DOComplete(UnityEngine.Audio.AudioMixer, bool)
  type: Method
  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModuleAudio.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Completes all tweens that have this target as a reference

    (meaning tweens that were started from this target, or that had this target added as an Id)

    and returns the total number of tweens completed

    (meaning the tweens that don't have infinite loops and were not already complete)
  example: []
  syntax:
    content: public static int DOComplete(this AudioMixer target, bool withCallbacks = false)
    parameters:
    - id: target
      type: UnityEngine.Audio.AudioMixer
    - id: withCallbacks
      type: System.Boolean
      description: >-
        For Sequences only: if TRUE also internal Sequence callbacks will be fired,
                    otherwise they will be ignored
    return:
      type: System.Int32
    content.vb: Public Shared Function DOComplete(target As AudioMixer, withCallbacks As Boolean = False) As Integer
  overload: DG.Tweening.DOTweenModuleAudio.DOComplete*
  nameWithType.vb: DOTweenModuleAudio.DOComplete(AudioMixer, Boolean)
  fullName.vb: DG.Tweening.DOTweenModuleAudio.DOComplete(UnityEngine.Audio.AudioMixer, Boolean)
  name.vb: DOComplete(AudioMixer, Boolean)

- uid: DG.Tweening.DOTweenModuleAudio.DOGoto(UnityEngine.Audio.AudioMixer,System.Single,System.Boolean)
  commentId: M:DG.Tweening.DOTweenModuleAudio.DOGoto(UnityEngine.Audio.AudioMixer,System.Single,System.Boolean)
  id: DOGoto(UnityEngine.Audio.AudioMixer,System.Single,System.Boolean)
  isExtensionMethod: true
  parent: DG.Tweening.DOTweenModuleAudio
  langs:
  - csharp
  - vb
  name: DOGoto(AudioMixer, float, bool)
  nameWithType: DOTweenModuleAudio.DOGoto(AudioMixer, float, bool)
  fullName: DG.Tweening.DOTweenModuleAudio.DOGoto(UnityEngine.Audio.AudioMixer, float, bool)
  type: Method
  source:
    href: https://github.com/CertifiedSharp/DRETesting/blob/0f4fc9272e85a282adb54396462acfadc16bc5bf/Assets/DREditor/DependencyPlugins/DOTween/Modules/DOTweenModuleAudio.cs
  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Sends to the given position all tweens that have this target as a reference

    (meaning tweens that were started from this target, or that had this target added as an Id)

    and returns the total number of tweens involved.
  example: []
  syntax:
    content: public static int DOGoto(this AudioMixer target, float to, bool andPlay = false)
    parameters:
    - id: target
      type: UnityEngine.Audio.AudioMixer
    - id: to
      type: System.Single
      description: >-
        Time position to reach
                    (if higher than the whole tween duration the tween will simply reach its end)
    - id: andPlay
      type: System.Boolean
      description: If TRUE will play the tween after reaching the given position, otherwise it will pause it
    return:
      type: System.Int32
    content.vb: Public Shared Function DOGoto(target As AudioMixer, [to] As Single, andPlay As Boolean = False) As Integer
  overload: DG.Tweening.DOTweenModuleAudio.DOGoto*

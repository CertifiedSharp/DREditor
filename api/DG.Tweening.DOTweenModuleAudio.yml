  assemblies:
  - DOTween.Modules
  namespace: DG.Tweening
  summary: >-
    Tweens an AudioSource's volume to the given value.
                Also stores the AudioSource as the tween's target so it can be used for filtered operations
  example: []
  syntax:
    content: public static TweenerCore<float, float, FloatOptions> DOFade(this AudioSource target, float endValue, float duration)
    parameters:
    - id: target
      type: UnityEngine.AudioSource
    - id: endValue
      type: System.Single
      description: The end value to reach (0 to 1)
    - id: duration
      type: System.Single
      description: The duration of the tween
    return:
      type: DG.Tweening.Core.TweenerCore{System.Single,System.Single,DG.Tweening.Plugins.Options.FloatOptions}
    content.vb: Public Shared Function DOFade(target As AudioSource, endValue As Single, duration As Single) As TweenerCore(Of Single, Single, FloatOptions)
